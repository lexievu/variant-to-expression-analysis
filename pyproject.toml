[project]
name = "variant-to-expression-analysis"
version = "0.1.0"
description = "Evaluate AlphaGenome expression predictions for cancer-associated DNA variants."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.5,<3",
    "pandas>=2.0,<3",
    "cyvcf2>=0.31,<0.32",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "scipy>=1.11,<2",
    "alphagenome",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "no_capture: disable pytest log capture for tests that inspect handler state",
]
